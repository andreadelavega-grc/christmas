function fitTags(){
  const g=$('.grid');if(!g)return;
  const max=Math.min(390,g.clientWidth);
  for(const c of g.children){
    c.style.flex='';
    const t=c.querySelector('h3');
    t.style.cssText='display:block;height:auto;min-height:0;max-height:none;overflow:visible;border-bottom:0';
    const cs=getComputedStyle(t),lh=parseFloat(cs.fontSize)*1.1,pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    let w=c.offsetWidth;
    while(Math.round((t.offsetHeight-pad)/lh)>2&&w<max){w+=20;c.style.flex='0 0 '+w+'px'}
    t.style.cssText='';
  }

function garland(){
  const st=$('.stage'),svg=st&&st.querySelector('.garland'),g=st&&st.querySelector('.grid');
  if(!svg)return;
  if(!g){svg.replaceChildren();return}
  const W=st.clientWidth,H=st.clientHeight,rows=[];
  for(const c of g.children){
    const o=parseFloat(getComputedStyle(c).marginTop)||0,top=Math.round(g.offsetTop+c.offsetTop-o);
    let r=rows.find(q=>Math.abs(q.top-top)<8);if(!r){r={top,it:[]};rows.push(r)}
    r.it.push({x:g.offsetLeft+c.offsetLeft+c.offsetWidth/2,rc:getComputedStyle(c).getPropertyValue('--rc').trim()||'#a9c4e8'});
  }
  let d='',px=0,py=0,sy=0,bows='';
  rows.forEach((r,i)=>{
    const dir=i%2?-1:1,y=r.top-22;r.it.sort((a,b)=>a.x-b.x);if(dir<0)r.it.reverse();
    const x0=dir>0?6:W-6;let x1=dir>0?W-6:6;
    if(i===rows.length-1)x1=Math.max(6,Math.min(W-6,r.it[r.it.length-1].x+dir*70));
    const pts=[x0,...r.it.map(a=>a.x),x1];
    d+=i?`C${x0-dir*26} ${py} ${x0-dir*26} ${y} ${x0} ${y}`:`M${x0} ${y}`;
    if(!i)sy=y;
    for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k],sag=Math.min(16,Math.abs(b-a)*.1);d+=`Q${(a+b)/2} ${y+sag*2} ${b} ${y}`}
    px=x1;py=y;
    r.it.forEach(a=>{bows+=`<g transform="translate(${a.x} ${y})"><path d="M0 0L-10 -6V6Z" fill="${a.rc}" stroke="#0003"/><path d="M0 0L10 -6V6Z" fill="${a.rc}" stroke="#0003"/><circle r="3.4" fill="${a.rc}" stroke="#0004"/></g>`});
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#f6efe2" stroke-width="2.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#c8383a" stroke-width="2.6" stroke-dasharray="5 5"/>`;
  const path=svg.firstChild,L=path.getTotalLength(),cols=['#2f6b4a','#3f7a56','#265a3f','#4f8f68'];
  let back='',front='',berries='',n=0;
  for(let s=4;s<L-2;s+=11,n++){
    const p=path.getPointAtLength(s),q=path.getPointAtLength(s+1),tx=q.x-p.x,ty=q.y-p.y,m=Math.hypot(tx,ty)||1;
    let nx=ty/m,ny=-tx/m;if(ny>0){nx=-nx;ny=-ny}
    if(Math.abs(ny)<.5&&nx*(p.x<W/2?-1:1)<0){nx=-nx;ny=-ny}
    const ba=Math.atan2(ny,nx)*180/Math.PI,sw=n%2?1:-1;
    const lf=(a,len,col)=>`<path transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(0)}) scale(${(len/16).toFixed(2)})" d="M0 0C4-7 12-7 16 0C12 7 4 7 0 0Z" fill="${col}"/>`;
    front+=lf(ba+sw*(22+(n*37)%30),14+(n*53)%9,cols[n%4]);
    back+=lf(ba-sw*(38+(n*29)%30),12+(n*41)%8,cols[(n+2)%4]);
    if(n%3===1)back+=lf(ba+180+sw*(30+(n*17)%25),9+(n*31)%5,cols[(n+1)%4]);
    if(n%6===2)for(const[a,b]of[[0,0],[5,-3],[-4,-4]])berries+=`<circle cx="${(p.x+nx*9+a).toFixed(1)}" cy="${(p.y+ny*9+b).toFixed(1)}" r="2.8" fill="#c8383a"/>`;
  }
  svg.insertAdjacentHTML('beforeend',back+front+berries+bows+`<circle cx="6" cy="${sy}" r="4.5" fill="#c9a24a"/><circle cx="${px}" cy="${py}" r="4.5" fill="#c9a24a"/>`);
}

function card(p,it,own){

  if(nt)b.append(h('p',{class:'nt'},nt));

    const rm=h('button',{class:'link',onclick:()=>{
